# 一键出片：私人助理（ops-desk）里点「🎬 做成视频」→ 调用这个工作流 → 配音、配空镜、渲染 → 成片和封面发到 Telegram。
# 只能由有写权限的人（私人助理用的令牌）手动触发；公开仓库的 Actions 免费。
name: render

on:
  workflow_dispatch:
    inputs:
      folder:
        description: "public/frontier/ 下的文件夹名，如 2026-11-02-1"
        required: true
      episode:
        description: "成片数据（episode.json 的内容）"
        required: true

# 一次只渲染一条，后点的排队，不取消前面的
concurrency:
  group: render
  cancel-in-progress: false

permissions:
  contents: write # 把配音、成片数据、新下载的空镜提交回仓库（下次重做不用再扣配音积分，空镜库越用越全）

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: video
    env:
      FOLDER: ${{ inputs.folder }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: video/package-lock.json
      - name: 安装 ffmpeg（空镜裁剪用）
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
      - run: npm ci

      - name: 写入成片数据
        env:
          EPISODE: ${{ inputs.episode }}
        run: |
          [[ "$FOLDER" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}(-[0-9]+)?$ ]] || { echo "文件夹名不对：$FOLDER"; exit 1; }
          mkdir -p "public/frontier/$FOLDER" out
          printf '%s' "$EPISODE" > "public/frontier/$FOLDER/episode.json"
          python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); assert d["script"] and d["shots"], "稿子或分段是空的"' "public/frontier/$FOLDER/episode.json"

      - name: 出片（配音 → 字幕 → 空镜 → 渲染）
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
          RENDER_CRF: "23"
        run: python3 tools/make_episode.py "$FOLDER"

      - name: 发到 Telegram
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1])).get("title",""))' "public/frontier/$FOLDER/episode.json")
          video="out/ai-frontier-$FOLDER.mp4"
          api="https://api.telegram.org/bot$TG_TOKEN"
          if [ "$(stat -c %s "$video")" -lt 49000000 ]; then
            curl -sf -F chat_id="$TG_CHAT" -F video=@"$video" -F supports_streaming=true \
              -F caption="🎬 $title（$FOLDER）" "$api/sendVideo" > /dev/null
          else
            curl -sf -d chat_id="$TG_CHAT" --data-urlencode text="🎬 $title：视频超过 50MB，到这里下载：$RUN_URL" "$api/sendMessage" > /dev/null
          fi
          curl -sf -F chat_id="$TG_CHAT" -F document=@"out/cover-$FOLDER.png" -F caption="封面（原图，发布时上传）" "$api/sendDocument" > /dev/null

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-frontier-${{ inputs.folder }}
          path: |
            video/out/*.mp4
            video/out/*.png
          retention-days: 7
          if-no-files-found: ignore

      - name: 保存配音、成片数据和新空镜
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "public/frontier/$FOLDER" public/broll
          git diff --cached --quiet && exit 0
          git commit -q -m "AI 前沿：$FOLDER 的配音、成片数据和新空镜"
          git pull -q --rebase origin main && git push -q origin HEAD:main

      - name: 失败时通知
        if: failure()
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -s -d chat_id="$TG_CHAT" --data-urlencode text="❌ 视频 $FOLDER 没做出来，看日志：$RUN_URL" \
            "https://api.telegram.org/bot$TG_TOKEN/sendMessage" > /dev/null
