# 「AI 科普」一键出片（横屏，默认 1 分钟，最长 5 分钟）：私人助理（ops-desk）里发「科普：题目」→ Claude 写稿 → 点「🎬 出片」→ 调用这个工作流。
# 一台机器每分钟成片要渲染约 5 分钟，所以拆成 8 段由 8 台机器并行渲染（公开仓库 Actions 免费），最后拼起来；1 分钟的约 8 分钟出片，5 分钟的约 15 分钟。
# 成片不放 GitHub（不发 Release、不留成片 Artifact），直接发到 Telegram（超过 50MB 才压缩，机器人发视频上限 50MB）。
name: explainer

on:
  workflow_dispatch:
    inputs:
      slug:
        description: "public/explainer/ 下的文件夹名，如 2026-11-02-1"
        required: true
      episode:
        description: "成片数据（episode.json 的内容）"
        required: true

concurrency:
  group: explainer
  cancel-in-progress: false

permissions:
  contents: write # 提交配音和成片数据（重做不重复扣配音积分）

env:
  SLUG: ${{ inputs.slug }}
  PARTS: 8

jobs:
  # 1. 配音、空镜、成片数据，提交回仓库；封面
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: video
    outputs:
      sha: ${{ steps.save.outputs.sha }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: video/package-lock.json
      - name: 安装 ffmpeg（空镜裁剪用）
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
      - run: npm ci
      - name: 写入成片数据
        env:
          EPISODE: ${{ inputs.episode }}
        run: |
          [[ "$SLUG" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}-[0-9]+$ ]] || { echo "文件夹名不对：$SLUG"; exit 1; }
          mkdir -p "public/explainer/$SLUG"
          printf '%s' "$EPISODE" > "public/explainer/$SLUG/episode.json"
          python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); assert d["title"] and d["scenes"], "标题或分段是空的"' "public/explainer/$SLUG/episode.json"
      - name: 配音、空镜、对时、封面
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
        run: python3 tools/make_explainer.py "$SLUG" --cover-only
      - uses: actions/upload-artifact@v4
        with:
          name: cover
          path: video/out/explainer-cover-${{ inputs.slug }}.png
      - name: 保存配音、成片数据和新空镜
        id: save
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "public/explainer/$SLUG" public/broll
          if ! git diff --cached --quiet; then
            git commit -q -m "AI 科普：$SLUG 的配音、成片数据和新空镜"
            git pull -q --rebase origin main && git push -q origin HEAD:main
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  # 2. 8 台机器各渲染一段画面（不带声音）；第 0 台顺便渲染整条音轨
  render:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      matrix:
        part: [0, 1, 2, 3, 4, 5, 6, 7]
    defaults:
      run:
        working-directory: video
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: video/package-lock.json
      - run: npm ci
      - name: 渲染第 ${{ matrix.part }} 段
        env:
          PART: ${{ matrix.part }}
        run: |
          props="public/explainer/$SLUG/auto.json"
          frames=$(python3 -c 'import json,sys; print(round(json.load(open(sys.argv[1]))["total"] * 30))' "$props")
          a=$(( frames * PART / PARTS )); b=$(( frames * (PART + 1) / PARTS - 1 ))
          mkdir -p out
          npx remotion render src/index.ts Explainer "out/part-$PART.mp4" --props "$props" --gl=swiftshader --muted --frames="$a-$b" --crf=20 --concurrency=4
          if [ "$PART" = 0 ]; then
            npx remotion render src/index.ts Explainer out/audio.wav --props "$props" --codec=wav
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: part-${{ matrix.part }}
          path: video/out/
          retention-days: 1

  # 3. 拼起来，发到 Telegram
  merge:
    needs: [prepare, render]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/download-artifact@v4
        with:
          path: parts
          merge-multiple: true
      - name: 安装 ffmpeg
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
      - name: 拼接成片和音轨（超过 50MB 才压缩）
        run: |
          for i in $(seq 0 $((PARTS - 1))); do echo "file 'part-$i.mp4'"; done > parts/list.txt
          ffmpeg -v error -y -f concat -safe 0 -i parts/list.txt -i parts/audio.wav -map 0:v -map 1:a -c:v copy -c:a aac -b:a 192k -shortest -movflags +faststart full.mp4
          if [ "$(stat -c %s full.mp4)" -gt 48000000 ]; then
            dur=$(ffprobe -v error -show_entries format=duration -of csv=p=0 full.mp4)
            kbps=$(python3 -c "print(int(45 * 8192 / $dur - 160))")
            ffmpeg -v error -y -i full.mp4 -c:v libx264 -preset medium -b:v "${kbps}k" -maxrate "${kbps}k" -bufsize "$((kbps * 2))k" -c:a aac -b:a 160k -movflags +faststart "explainer-$SLUG.mp4"
          else
            mv full.mp4 "explainer-$SLUG.mp4"
          fi
          ls -la "explainer-$SLUG.mp4"
      - name: 发到 Telegram
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          title=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["title"])' "video/public/explainer/$SLUG/episode.json")
          api="https://api.telegram.org/bot$TG_TOKEN"
          curl -sf -F chat_id="$TG_CHAT" -F video=@"explainer-$SLUG.mp4" -F supports_streaming=true -F width=1920 -F height=1080 \
            -F caption="🎬 AI 科普：$title（$SLUG）" "$api/sendVideo" > /dev/null
          curl -sf -F chat_id="$TG_CHAT" -F document=@"parts/explainer-cover-$SLUG.png" -F caption="封面（原图，发布时上传）" "$api/sendDocument" > /dev/null

  notify-failure:
    needs: [prepare, render, merge]
    if: failure()
    runs-on: ubuntu-24.04
    steps:
      - env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -s -d chat_id="$TG_CHAT" --data-urlencode text="❌ AI 科普 $SLUG 没做出来，看日志：$RUN_URL" \
            "https://api.telegram.org/bot$TG_TOKEN/sendMessage" > /dev/null
