# 一键出片（方案第十三节第 4 周；《方案补充》#26）：填分镜文件 → 校验 → 多台机器并行渲染 → 拼接 + 混音 → 自动质检 → 归档提交回仓库 → 发 Telegram。
# 触发前必须先得到用户同意（CLAUDE.md「先问再做」）。
name: produce

on:
  workflow_dispatch:
    inputs:
      storyboard:
        description: "分镜 storyboard.json 路径（相对 video/，如 storyboards/2026-11-03-ai-100-years/storyboard.json）"
        required: true
      parts:
        description: "拆给几台机器并行渲染（1–20）"
        required: false
        default: "20"
      gl:
        description: "渲染方式：swangle（three.js 镜头必须用它）或 swiftshader（纯 CSS，快）"
        required: false
        default: "swangle"
      archive:
        description: "质检后把归档（archives/<分镜 id>/）提交回 main"
        type: boolean
        required: false
        default: true
      caption:
        description: "发到 Telegram 时的说明（留空用分镜标题）"
        required: false
        default: ""

concurrency:
  group: produce
  cancel-in-progress: false

jobs:
  # 1. 校验分镜 + 按帧拆段
  plan:
    runs-on: ubuntu-24.04
    outputs:
      items: ${{ steps.l.outputs.items }}
      id: ${{ steps.l.outputs.id }}
      title: ${{ steps.l.outputs.title }}
      parts: ${{ steps.l.outputs.parts }}
    defaults:
      run:
        working-directory: video
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: video/package-lock.json
      - run: npm ci
      - name: 校验分镜（Schema / 资产 / 参数 / 时长 / 字卡）
        env:
          SB: ${{ inputs.storyboard }}
        run: |
          case "$SB" in storyboards/*/storyboard.json) ;; *) echo "路径应为 storyboards/<id>/storyboard.json"; exit 1;; esac
          node tools/shot.mjs validate-storyboard "$SB"
      - id: l
        env:
          SB: ${{ inputs.storyboard }}
          PARTS: ${{ inputs.parts }}
        run: |
          python3 - >> "$GITHUB_OUTPUT" <<'PY'
          import json, os
          sb = json.load(open(os.environ["SB"]))
          total = sum(round(s["config"]["duration"] * sb["fps"]) for s in sb["shots"])
          n = max(1, min(20, int(os.environ.get("PARTS") or 20), total))
          items = [{"n": f"{p:02d}", "frames": f"{total * p // n}-{total * (p + 1) // n - 1}"} for p in range(n)]
          print("items=" + json.dumps(items))
          print(f"parts={n}")
          print("id=" + sb["id"])
          print("title=" + sb.get("title", sb["id"]).replace("\n", " "))
          PY

  # 2. 并行渲染（Storyboard 合成，props = 分镜）
  render:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: true
      matrix:
        item: ${{ fromJson(needs.plan.outputs.items) }}
    defaults:
      run:
        working-directory: video
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: video/package-lock.json
      - run: npm ci
      - name: 渲染第 ${{ matrix.item.n }} 段（帧 ${{ matrix.item.frames }}）
        env:
          SB: ${{ inputs.storyboard }}
        run: |
          python3 -c "import json,sys; json.dump({'storyboard': json.load(open(sys.argv[1])), 'annotate': False}, open('props.json','w'))" "$SB"
          npx remotion render src/index.ts Storyboard "out/${{ matrix.item.n }}.mp4" --props=props.json --frames=${{ matrix.item.frames }} \
            --concurrency=2 --crf=18 --timeout=600000 --gl="${{ inputs.gl }}"
      - uses: actions/upload-artifact@v4
        with:
          name: seg-${{ matrix.item.n }}
          path: video/out/${{ matrix.item.n }}.mp4
          retention-days: 1

  # 3. 拼接 + 混音 + 质检 + 归档 + 发 Telegram
  finish:
    needs: [plan, render]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    defaults:
      run:
        working-directory: video
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 50      # 归档提交前要 pull --rebase，浅克隆可能找不到共同祖先
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: video/package-lock.json
      - run: npm ci
      - name: 安装 ffmpeg / Pillow / numpy
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg python3-pil python3-numpy
      - uses: actions/download-artifact@v4
        with:
          pattern: seg-*
          path: video/segs
          merge-multiple: true
      - name: 拼接 + 混音（tools/mix_audio.py）
        env:
          SB: ${{ inputs.storyboard }}
        run: |
          mkdir -p out
          ls segs/*.mp4 | sort | sed "s#^#file '$PWD/#; s#\$#'#" > out/list.txt
          ffmpeg -nostdin -v error -y -f concat -safe 0 -i out/list.txt -map 0:v -c copy out/video.mp4
          if python3 -c "import json,sys; a=json.load(open(sys.argv[1])).get('audio') or {}; sys.exit(0 if a.get('ambient') or a.get('sfx') else 1)" "$SB"; then
            python3 tools/mix_audio.py "$SB" out/audio.wav
            ffmpeg -nostdin -v error -y -i out/video.mp4 -i out/audio.wav -map 0:v -map 1:a -c:v copy -c:a aac -b:a 192k -shortest -movflags +faststart out/final.mp4
          else
            ffmpeg -nostdin -v error -y -i out/video.mp4 -c copy -movflags +faststart out/final.mp4
          fi
      - name: 自动质检（tools/qc.py）
        id: qc
        env:
          SB: ${{ inputs.storyboard }}
        run: |
          set +e
          python3 tools/qc.py out/final.mp4 "$SB" out
          echo "code=$?" >> "$GITHUB_OUTPUT"
      - name: 归档（tools/archive.py）并提交回 main
        if: ${{ inputs.archive }}
        env:
          SB: ${{ inputs.storyboard }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 tools/archive.py "$SB" --video out/final.mp4 --qc out/qc.json --run-id "${{ github.run_id }}" --run-url "$RUN_URL" \
            --parts "${{ needs.plan.outputs.parts }}" --gl "${{ inputs.gl }}" || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add archives
          if ! git diff --cached --quiet; then
            git commit -m "归档：${{ needs.plan.outputs.title }}（produce run ${{ github.run_id }}）"
            for i in 1 2 3; do git pull --rebase -q origin main && git push -q origin HEAD:main && break; sleep 5; done
          fi
      - name: 成片保留 7 天（Actions 产物）
        uses: actions/upload-artifact@v4
        with:
          name: final-${{ needs.plan.outputs.id }}
          path: |
            video/out/final.mp4
            video/out/qc.json
            video/out/qc.md
          retention-days: 7
      - name: 发到 Telegram（超过 48MB 压一版发送用，归档记的是原片）
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          CAPTION: ${{ inputs.caption || needs.plan.outputs.title }}
          QC_CODE: ${{ steps.qc.outputs.code }}
        run: |
          f=out/final.mp4
          if [ "$(stat -c %s $f)" -gt 48000000 ]; then
            dur=$(ffprobe -v error -show_entries format=duration -of csv=p=0 $f)
            kbps=$(python3 -c "print(int(46 * 8192 / $dur))")
            ffmpeg -nostdin -v error -y -i $f -c:v libx264 -preset medium -b:v "${kbps}k" -maxrate "${kbps}k" -bufsize "$((kbps * 2))k" -c:a copy -movflags +faststart out/tg.mp4
            f=out/tg.mp4
          fi
          mark=$([ "$QC_CODE" = "0" ] && echo "✅" || echo "❌ 质检有错误")
          curl -sf -F chat_id="$TG_CHAT" -F video=@$f -F supports_streaming=true -F width=1920 -F height=1080 -F caption="🎬 $CAPTION $mark" \
            "https://api.telegram.org/bot$TG_TOKEN/sendVideo" > /dev/null
          python3 -c "import sys; t=open('out/qc.md').read(); print(t[:3900] + ('\n…（完整见 qc.json）' if len(t) > 3900 else ''))" > out/qc_msg.txt
          curl -sf --data-urlencode chat_id="$TG_CHAT" --data-urlencode text@out/qc_msg.txt "https://api.telegram.org/bot$TG_TOKEN/sendMessage" > /dev/null
