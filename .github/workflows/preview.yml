# 预览：渲染指定的几个 Composition（每个一台机器并行），按顺序拼起来发到 Telegram。新镜头、新样片都用它看效果。
name: preview

on:
  workflow_dispatch:
    inputs:
      compositions:
        description: "要渲染的 Composition id，逗号分隔，按播放顺序，如 Sci-ShardOpen,Sci-LayerExplode"
        required: true
      gl:
        description: "渲染方式：swangle（含 three.js / WebGL 的镜头必须用它）或 swiftshader（纯 CSS 镜头，快 3 倍）"
        required: false
        default: "swangle"
      frames:
        description: "只渲染这段帧（如 0-299；留空 = 整段）"
        required: false
        default: ""
      parts:
        description: "把每个 Composition 的帧段拆给几台机器并行（重 Shader 镜头用，最多 20；需同时填 frames）"
        required: false
        default: "1"
      storyboard:
        description: "分镜音频：storyboard.json 路径（相对 video/，如 storyboards/2026-11-03-ai-100-years/storyboard.json）；填了就按它整段混音替换音轨"
        required: false
        default: ""
      reuse_run:
        description: "复用某次运行已渲好的分段（填 run id，只重新拼接 + 混音，不重渲；分段保留 1 天）"
        required: false
        default: ""
      caption:
        description: "发到 Telegram 时的说明"
        required: false
        default: "🎞 预览"

concurrency:
  group: preview
  cancel-in-progress: true

jobs:
  list:
    runs-on: ubuntu-24.04
    outputs:
      items: ${{ steps.l.outputs.items }}
    steps:
      - id: l
        env:
          COMPS: ${{ inputs.compositions }}
          FRAMES: ${{ inputs.frames }}
          PARTS: ${{ inputs.parts }}
        run: |
          python3 - >> "$GITHUB_OUTPUT" <<'PY'
          import json, os, re
          ids = [x.strip() for x in os.environ["COMPS"].split(",") if x.strip()]
          assert ids and all(re.fullmatch(r"[A-Za-z0-9_-]+", i) for i in ids), "id 不对"
          fr = os.environ.get("FRAMES", "").strip()
          parts = max(1, min(20, int(os.environ.get("PARTS", "1") or 1)))
          items = []
          for k, i in enumerate(ids):
              if fr:
                  a, b = map(int, re.fullmatch(r"(\d+)-(\d+)", fr).groups())
                  n = min(parts, b - a + 1)
                  for p in range(n):
                      lo = a + (b - a + 1) * p // n
                      hi = a + (b - a + 1) * (p + 1) // n - 1
                      items.append({"n": f"{k:02d}-{p:02d}", "id": i, "frames": f"{lo}-{hi}"})
              else:
                  items.append({"n": f"{k:02d}-00", "id": i, "frames": ""})
          print("items=" + json.dumps(items))
          PY

  render:
    needs: list
    if: ${{ inputs.reuse_run == '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        item: ${{ fromJson(needs.list.outputs.items) }}
    defaults:
      run:
        working-directory: video
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: video/package-lock.json
      - run: npm ci
      - name: 渲染 ${{ matrix.item.id }} ${{ matrix.item.frames }}
        run: npx remotion render src/index.ts "${{ matrix.item.id }}" "out/${{ matrix.item.n }}.mp4" --concurrency=2 --crf=18 --timeout=600000 --gl="${{ inputs.gl }}" ${{ matrix.item.frames && format('--frames={0}', matrix.item.frames) || '' }}
      - uses: actions/upload-artifact@v4
        with:
          name: p-${{ matrix.item.n }}
          path: video/out/${{ matrix.item.n }}.mp4
          retention-days: 1

  merge:
    needs: [list, render]
    if: ${{ always() && (needs.render.result == 'success' || (inputs.reuse_run != '' && needs.render.result == 'skipped')) }}
    permissions:
      actions: read
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: p-*
          path: parts
          merge-multiple: true
          run-id: ${{ inputs.reuse_run || github.run_id }}
          github-token: ${{ github.token }}
      - name: 安装 ffmpeg
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
      # 有分镜音频：按 storyboard.json 用 ffmpeg 整段混音再替换（分段渲染的音频直接拼会在接缝处断音）
      - uses: actions/checkout@v5
        if: ${{ inputs.storyboard != '' }}
        with:
          path: src
      - name: 混音（tools/mix_audio.py）
        if: ${{ inputs.storyboard != '' }}
        run: |
          python3 src/video/tools/mix_audio.py "src/video/${{ inputs.storyboard }}" audio.wav
      - name: 拼接（超过 50MB 就压缩）
        run: |
          ls parts/*.mp4 | sort | sed "s#^#file '#; s#\$#'#" > list.txt
          ffmpeg -nostdin -v error -y -f concat -safe 0 -i list.txt -c copy full.mp4
          if [ -f audio.wav ]; then
            ffmpeg -nostdin -v error -y -i full.mp4 -i audio.wav -map 0:v -map 1:a -c:v copy -c:a aac -b:a 192k -shortest full2.mp4 && mv full2.mp4 full.mp4
          fi
          if [ "$(stat -c %s full.mp4)" -gt 48000000 ]; then
            dur=$(ffprobe -v error -show_entries format=duration -of csv=p=0 full.mp4)
            kbps=$(python3 -c "print(int(46 * 8192 / $dur))")
            ffmpeg -nostdin -v error -y -i full.mp4 -c:v libx264 -preset medium -b:v "${kbps}k" -maxrate "${kbps}k" -bufsize "$((kbps * 2))k" -c:a copy -movflags +faststart preview.mp4
          else
            mv full.mp4 preview.mp4
          fi
      - name: 发到 Telegram
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          CAPTION: ${{ inputs.caption }}
        run: |
          curl -sf -F chat_id="$TG_CHAT" -F video=@preview.mp4 -F supports_streaming=true -F width=1920 -F height=1080 -F caption="$CAPTION" \
            "https://api.telegram.org/bot$TG_TOKEN/sendVideo" > /dev/null
